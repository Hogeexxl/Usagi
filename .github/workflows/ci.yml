name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  macos:
    name: macOS arm64
    runs-on: macos-14
    env:
      GOTOOLCHAIN: local
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Verify macOS arm64 runner
        run: test "$(uname -m)" = 'arm64'
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: '1.27.1'
      - name: Verify exact Go version
        run: test "$(go env GOVERSION)" = 'go1.27.1'
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci
      - name: Install Playwright Chromium
        working-directory: frontend
        run: npx playwright install chromium
      - name: Run frontend tests
        working-directory: frontend
        run: npm test
      - name: Type-check frontend
        working-directory: frontend
        run: npm run check
      - name: Build production runtime
        run: bash scripts/build_macos_runtime.sh
      # The Go suite serves the production Vite assets, so it runs after the build.
      - name: Run Go tests
        run: go test ./...
      - name: Run Go vet
        run: go vet ./...
      - name: Residue gate
        run: bash scripts/ci/check_spec05_residue.sh
      - name: Runtime smoke
        run: bash scripts/ci/smoke_macos_runtime.sh
      - name: Browser gate
        run: npm --prefix frontend run test:browser:gate
