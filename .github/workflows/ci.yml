name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend dependencies
        run: npm ci
      - name: Run frontend tests
        run: npm test
      - name: Type-check frontend
        run: npm run check
      - name: Build frontend
        run: npm run build

  rust-format:
    name: Rust format
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Check Rust formatting
        run: cargo fmt --check

  rust:
    name: Rust (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows x64
            os: windows-latest
            architecture: AMD64
          - name: macOS arm64
            os: macos-latest
            architecture: arm64
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Rust stable
        uses: dtolnay/rust-toolchain@stable
      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
      - name: Verify Windows x64 runner
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          if ($env:PROCESSOR_ARCHITECTURE -ne 'AMD64') {
            throw "Expected an x64 Windows runner, got $env:PROCESSOR_ARCHITECTURE"
          }
      - name: Verify macOS runner architecture
        if: runner.os == 'macOS'
        shell: bash
        run: test "$(uname -m)" = "${{ matrix.architecture }}"
      - name: Check Rust dependencies
        run: cargo check --locked
      - name: Run all Rust tests
        run: cargo test --locked
      - name: Run Windows distribution identity/scanner evidence
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          cargo test --locked file_identity
          cargo test --locked scanner

  embedded:
    name: Embedded release smoke (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows x64
            os: windows-latest
            architecture: AMD64
          - name: macOS arm64
            os: macos-latest
            architecture: arm64
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Set up Rust stable
        uses: dtolnay/rust-toolchain@stable
      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
      - name: Verify Windows x64 runner
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          if ($env:PROCESSOR_ARCHITECTURE -ne 'AMD64') {
            throw "Expected an x64 Windows runner, got $env:PROCESSOR_ARCHITECTURE"
          }
      - name: Verify macOS runner architecture
        if: runner.os == 'macOS'
        shell: bash
        run: test "$(uname -m)" = "${{ matrix.architecture }}"
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci
      - name: Build frontend assets
        working-directory: frontend
        run: npm run build
      - name: Build embedded release binary
        run: cargo build --release --locked --features embedded-frontend
      - name: Run embedded frontend runtime smoke
        run: cargo test --locked --test distribution_runtime_integration t_dist_005_release_binary_serves_embedded_frontend_outside_repository -- --nocapture

  go-spec01:
    name: Go Spec01 (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    env:
      GOTOOLCHAIN: local
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows x64
            os: windows-latest
            architecture: AMD64
          - name: macOS arm64
            os: macos-latest
            architecture: arm64
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: '1.27.1'
      - name: Verify exact Go version
        shell: bash
        run: test "$(go env GOVERSION)" = 'go1.27.1'
      - name: Set up Python
        id: python
        uses: actions/setup-python@v6
        with:
          python-version: '3.14.8'
      - name: Save Windows Python executable
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $PythonExecutable = & '${{ steps.python.outputs.python-path }}' -c 'import sys; print(sys.executable)'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          "PYTHON_EXECUTABLE=$PythonExecutable" >> $env:GITHUB_ENV
      - name: Save macOS Python executable
        if: runner.os == 'macOS'
        shell: bash
        run: |
          PYTHON_EXECUTABLE=$("${{ steps.python.outputs.python-path }}" -c 'import sys; print(sys.executable)')
          printf 'PYTHON_EXECUTABLE=%s\n' "$PYTHON_EXECUTABLE" >> "$GITHUB_ENV"
      - name: Set up Rust for Oracle
        uses: dtolnay/rust-toolchain@stable
      - name: Verify Windows x64 runner
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          if ($env:PROCESSOR_ARCHITECTURE -ne 'AMD64') {
            throw "Expected an x64 Windows runner, got $env:PROCESSOR_ARCHITECTURE"
          }
      - name: Verify macOS arm64 runner
        if: runner.os == 'macOS'
        shell: bash
        run: test "$(uname -m)" = 'arm64'
      - name: Check Spec01 on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: pwsh -File scripts/ci/check_spec01.ps1 -PythonExecutable $env:PYTHON_EXECUTABLE
      - name: Check Spec01 on macOS
        if: runner.os == 'macOS'
        shell: bash
        run: bash scripts/ci/check_spec01.sh --python "$PYTHON_EXECUTABLE"

  go-spec02:
    name: Go Spec02 (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    env:
      GOTOOLCHAIN: local
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows x64
            os: windows-latest
            architecture: AMD64
          - name: macOS arm64
            os: macos-latest
            architecture: arm64
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: '1.27.1'
      - name: Verify Windows x64 runner
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          if ($env:PROCESSOR_ARCHITECTURE -ne 'AMD64') {
            throw "Expected an x64 Windows runner, got $env:PROCESSOR_ARCHITECTURE"
          }
      - name: Verify macOS arm64 runner
        if: runner.os == 'macOS'
        shell: bash
        run: test "$(uname -m)" = 'arm64'
      - name: Check Spec02 on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: pwsh -File scripts/ci/check_spec02.ps1
      - name: Check Spec02 on macOS
        if: runner.os == 'macOS'
        shell: bash
        run: bash scripts/ci/check_spec02.sh
