name: S13 and FINAL Release Validation

on:
  workflow_run:
    workflows:
      - Release
    types:
      - completed
  workflow_dispatch:
    inputs:
      release_run_id:
        description: Successful canonical Release workflow run ID
        required: true
        type: string
      release_tag:
        description: Stable release tag, for example v0.1.1
        required: true
        type: string
      release_head_sha:
        description: Commit SHA released by the canonical Release workflow
        required: true
        type: string

permissions:
  contents: read
  actions: read

env:
  CARGO_TERM_COLOR: always

jobs:
  published-update-e2e:
    name: T-DIST-015 public Release update E2E
    if: >-
      ${{
        (
          github.event_name == 'workflow_run' &&
          github.event.workflow_run.conclusion == 'success' &&
          startsWith(github.event.workflow_run.head_branch, 'v') &&
          !contains(github.event.workflow_run.head_branch, '-rc.')
        ) || (
          github.event_name == 'workflow_dispatch' &&
          startsWith(inputs.release_tag, 'v') &&
          !contains(inputs.release_tag, '-rc.')
        )
      }}
    runs-on: macos-latest
    steps:
      - name: Validate explicit successful Release run evidence
        if: ${{ github.event_name == 'workflow_dispatch' }}
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_RUN_ID: ${{ inputs.release_run_id }}
          RELEASE_TAG: ${{ inputs.release_tag }}
          RELEASE_HEAD_SHA: ${{ inputs.release_head_sha }}
        run: |
          set -euo pipefail
          evidence="$RUNNER_TEMP/release-run.json"
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$RELEASE_RUN_ID" > "$evidence"
          python3 - "$evidence" "$RELEASE_TAG" "$RELEASE_HEAD_SHA" <<'PY'
          import json
          import pathlib
          import sys

          run = json.loads(pathlib.Path(sys.argv[1]).read_text(encoding="utf-8"))
          expected_tag = sys.argv[2]
          expected_sha = sys.argv[3]
          checks = {
              "name": run.get("name") == "Release",
              "path": run.get("path") == ".github/workflows/release.yml",
              "status": run.get("status") == "completed",
              "conclusion": run.get("conclusion") == "success",
              "head_branch": run.get("head_branch") == expected_tag,
              "head_sha": run.get("head_sha") == expected_sha,
          }
          failed = [name for name, passed in checks.items() if not passed]
          if failed:
              raise SystemExit(f"Release run evidence mismatch: {failed}; run={run}")
          PY

      - name: Check out released commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || inputs.release_head_sha }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Set up Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Download arm64 DMG from the successful Release run
        uses: actions/download-artifact@v4
        with:
          name: macos-dmg
          path: staging/macos
          repository: ${{ github.repository }}
          run-id: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.id || inputs.release_run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Build frontend for internal lower-version probe
        working-directory: frontend
        run: |
          npm ci
          npm run build

      - name: Run T-DIST-015 against anonymous public latest Release
        shell: bash
        env:
          RELEASE_TAG: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_branch || inputs.release_tag }}
          USAGI_RELEASE_DMG: staging/macos/Usagi-${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_branch || inputs.release_tag }}-macos-arm64.dmg
        run: |
          export GITHUB_REF_NAME="$RELEASE_TAG"
          bash ./.github/scripts/s13-public-release-e2e.sh

  frontend-regression:
    name: T-DIST-016 frontend regression
    needs: published-update-e2e
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Check out released commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || inputs.release_head_sha }}
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend dependencies
        run: npm ci
      - name: Run all frontend tests
        run: npm run test
      - name: Type-check frontend
        run: npm run check
      - name: Build frontend
        run: npm run build

  rust-regression:
    name: T-DIST-016 Rust (${{ matrix.name }})
    needs: published-update-e2e
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows x64
            os: windows-latest
            architecture: AMD64
          - name: macOS arm64
            os: macos-latest
            architecture: arm64
    steps:
      - name: Check out released commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || inputs.release_head_sha }}
      - name: Set up Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
      - name: Verify Windows x64 runner
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          if ($env:PROCESSOR_ARCHITECTURE -ne 'AMD64') {
            throw "Expected an x64 Windows runner, got $env:PROCESSOR_ARCHITECTURE"
          }
      - name: Verify Apple Silicon runner
        if: runner.os == 'macOS'
        shell: bash
        run: test "$(uname -m)" = "${{ matrix.architecture }}"
      - name: Check Rust formatting
        run: cargo fmt --check
      - name: Check Rust dependencies
        run: cargo check --locked
      - name: Run unfiltered Rust tests
        run: cargo test --locked

  clippy-quality:
    name: Release quality Clippy evidence
    needs: published-update-e2e
    runs-on: ubuntu-latest
    steps:
      - name: Check out released commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || inputs.release_head_sha }}
      - name: Set up Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - name: Execute formal Clippy command
        continue-on-error: true
        run: cargo clippy --all-targets -- -D warnings
      - name: Preserve Clippy baseline rule
        shell: bash
        run: |
          echo 'The formal Clippy command was executed.'
          echo 'Per the v0.1 test standard, pre-existing unrelated baseline warnings are recorded separately and must not trigger scope expansion.'
          echo 'Any warning introduced by S13/FINAL changes blocks manual closure of the FINAL Gate.'

  resource-p2:
    name: T-DIST-017 affected RSS P2 (${{ matrix.name }})
    needs: published-update-e2e
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows x64
            os: windows-latest
            architecture: AMD64
          - name: macOS arm64
            os: macos-latest
            architecture: arm64
    steps:
      - name: Check out released commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || inputs.release_head_sha }}
      - name: Set up Rust stable
        uses: dtolnay/rust-toolchain@stable
      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
      - name: Verify Windows x64 runner
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          if ($env:PROCESSOR_ARCHITECTURE -ne 'AMD64') {
            throw "Expected an x64 Windows runner, got $env:PROCESSOR_ARCHITECTURE"
          }
      - name: Verify Apple Silicon runner
        if: runner.os == 'macOS'
        shell: bash
        run: test "$(uname -m)" = "${{ matrix.architecture }}"
      - name: Run affected chunk-reader RSS resource P2
        run: cargo test --locked t_s04_052_one_gib_bounded_reader_keeps_batches_and_process_memory_bounded -- --ignored --nocapture

  automated-final:
    name: Automated FINAL evidence summary
    if: >-
      ${{
        always() &&
        (
          (
            github.event_name == 'workflow_run' &&
            github.event.workflow_run.conclusion == 'success' &&
            startsWith(github.event.workflow_run.head_branch, 'v') &&
            !contains(github.event.workflow_run.head_branch, '-rc.')
          ) || (
            github.event_name == 'workflow_dispatch' &&
            startsWith(inputs.release_tag, 'v') &&
            !contains(inputs.release_tag, '-rc.')
          )
        )
      }}
    needs:
      - published-update-e2e
      - frontend-regression
      - rust-regression
      - clippy-quality
      - resource-p2
    runs-on: ubuntu-latest
    steps:
      - name: Require all hard automated gates
        shell: bash
        run: |
          test '${{ needs.published-update-e2e.result }}' = success
          test '${{ needs.frontend-regression.result }}' = success
          test '${{ needs.rust-regression.result }}' = success
          test '${{ needs.clippy-quality.result }}' = success
          test '${{ needs.resource-p2.result }}' = success
          echo 'T-DIST-015 automated evidence PASS'
          echo 'T-DIST-016 automated evidence PASS'
          echo 'T-DIST-017 automated evidence PASS'
          echo 'Clippy output still requires the baseline/new-warning classification defined by the formal test standard.'
