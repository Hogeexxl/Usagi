name: Release

on:
  push:
    tags:
      - 'v[0-9]*'

permissions:
  contents: read

jobs:
  build-macos-arm64:
    name: Build macOS arm64 release
    runs-on: macos-15
    permissions:
      contents: read
    env:
      GOTOOLCHAIN: local
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Resolve release version
        id: release_version
        shell: bash
        run: |
          if [[ ! "$GITHUB_REF_NAME" =~ ^v([0-9]+\.[0-9]+\.[0-9]+(-rc\.[0-9]+)?)$ ]]; then
            printf 'invalid release tag: %s\n' "$GITHUB_REF_NAME" >&2
            exit 1
          fi
          RELEASE_VERSION="${BASH_REMATCH[1]}"
          printf 'RELEASE_VERSION=%s\n' "$RELEASE_VERSION" >> "$GITHUB_ENV"
          printf 'version=%s\n' "$RELEASE_VERSION" >> "$GITHUB_OUTPUT"
      - name: Verify macOS arm64 runner
        run: test "$(uname -m)" = 'arm64'
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: '1.27.1'
      - name: Verify exact Go version
        run: test "$(go env GOVERSION)" = 'go1.27.1'
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci
      - name: Build macOS runtime
        run: bash scripts/build_macos_runtime.sh "$RELEASE_VERSION"
      - name: Package macOS DMG
        run: bash scripts/package_macos_release.sh "$RELEASE_VERSION"
      - name: Smoke-test packaged macOS DMG
        run: bash scripts/ci/smoke_macos_dmg.sh "dist/Usagi-v${RELEASE_VERSION}-macos-arm64.dmg" "$RELEASE_VERSION"
      - name: Build macOS Codex plugin
        run: bash scripts/build_codex_plugin.sh
      - name: Stage release Codex plugin
        shell: bash
        run: |
          STAGING_ROOT="dist/codex-plugin/macos-arm64/usagi"
          PLUGIN_JSON="$STAGING_ROOT/plugin.json"
          PLUGIN_ZIP="$(pwd)/dist/Usagi-Codex-Plugin-v${RELEASE_VERSION}-macos-arm64.zip"

          rm -rf "$STAGING_ROOT"
          mkdir -p "$STAGING_ROOT"
          cp -R plugins/usagi/. "$STAGING_ROOT/"

          VERSION_LINE_COUNT="$(grep -c -E '^[[:space:]]*"version"[[:space:]]*:' "$PLUGIN_JSON" || true)"
          if [[ "$VERSION_LINE_COUNT" -ne 1 ]]; then
            printf 'expected one version entry in %s, found %s\n' "$PLUGIN_JSON" "$VERSION_LINE_COUNT" >&2
            exit 1
          fi
          sed -i '' -E "s/^([[:space:]]*\"version\"[[:space:]]*:[[:space:]]*\")[^\"]+(\".*)$/\1${RELEASE_VERSION}\2/" "$PLUGIN_JSON"

          bash scripts/ci/check_codex_plugin.sh "$STAGING_ROOT" "$RELEASE_VERSION"

          rm -f "$PLUGIN_ZIP"
          (
            cd "$STAGING_ROOT"
            zip -qr "$PLUGIN_ZIP" plugin.json mcp.json bin app assets
          )
          test -s "$PLUGIN_ZIP"
      - name: Upload macOS runtime artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-macos-runtime
          path: dist/Usagi-v${{ steps.release_version.outputs.version }}-macos-arm64.dmg
          if-no-files-found: error
      - name: Upload macOS Plugin artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-macos-plugin
          path: dist/Usagi-Codex-Plugin-v${{ steps.release_version.outputs.version }}-macos-arm64.zip
          if-no-files-found: error

  build-windows-x64:
    name: Build Windows x64 release
    runs-on: windows-latest
    permissions:
      contents: read
    env:
      GOTOOLCHAIN: local
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Resolve release version
        id: release_version
        shell: powershell
        run: |
          $TagMatch = [regex]::Match(
              $env:GITHUB_REF_NAME,
              '^v([0-9]+\.[0-9]+\.[0-9]+(-rc\.[0-9]+)?)$'
          )
          if (-not $TagMatch.Success) {
              throw "invalid release tag: $($env:GITHUB_REF_NAME)"
          }
          $env:RELEASE_VERSION = $TagMatch.Groups[1].Value
          [System.IO.File]::AppendAllText(
              $env:GITHUB_ENV,
              "RELEASE_VERSION=$($env:RELEASE_VERSION)`n"
          )
          [System.IO.File]::AppendAllText(
              $env:GITHUB_OUTPUT,
              "version=$($env:RELEASE_VERSION)`n"
          )
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: '1.27.1'
      - name: Verify exact Go version
        shell: powershell
        run: |
          $Version = (go env GOVERSION).Trim()
          if ($Version -cne "go1.27.1") {
              throw "Go version is '$Version', want 'go1.27.1'"
          }
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci
      - name: Install and verify NSIS 3.13.0
        shell: powershell
        run: |
          choco install nsis --version=3.13.0 --no-progress --yes --force --allow-downgrade
          if ($LASTEXITCODE -ne 0) {
              throw "Chocolatey failed to install NSIS 3.13.0 (exit $LASTEXITCODE)"
          }

          $NsisDirectory = Join-Path ${env:ProgramFiles(x86)} "NSIS"
          $Makensis = Join-Path $NsisDirectory "makensis.exe"
          if (-not (Test-Path -LiteralPath $Makensis -PathType Leaf)) {
              throw "makensis.exe was not installed at $Makensis"
          }

          $env:PATH = "$NsisDirectory;$env:PATH"
          [System.IO.File]::AppendAllText(
              $env:GITHUB_PATH,
              $NsisDirectory + [Environment]::NewLine
          )

          $ActualVersion = (& $Makensis /VERSION 2>&1 | Out-String).Trim()
          $NsisExitCode = $LASTEXITCODE
          if ($NsisExitCode -ne 0 -or $ActualVersion -cne "v3.13") {
              throw "makensis version is '$ActualVersion' (exit $NsisExitCode), want 'v3.13'"
          }
      - name: Build Windows runtime
        shell: powershell
        run: powershell -File scripts/build_windows_runtime.ps1 -Version $env:RELEASE_VERSION
      - name: Check Windows PE
        shell: powershell
        run: powershell -File scripts/ci/check_windows_pe.ps1
      - name: Package Windows installer
        shell: powershell
        run: powershell -File scripts/package_windows_installer.ps1 -Version $env:RELEASE_VERSION
      - name: Smoke-test installed Windows runtime
        shell: powershell
        run: powershell -File scripts/ci/smoke_windows_installer.ps1 -InstallerPath "dist\Usagi-v$($env:RELEASE_VERSION)-windows-x64-setup.exe" -ExpectedVersion $env:RELEASE_VERSION
      - name: Smoke-test Windows Magpie integration
        shell: powershell
        run: powershell -File scripts/ci/smoke_windows_magpie.ps1 -InstallerPath "dist\Usagi-v$($env:RELEASE_VERSION)-windows-x64-setup.exe" -ExpectedVersion $env:RELEASE_VERSION
      - name: Build Windows Codex plugin
        shell: powershell
        run: powershell -File scripts/build_codex_plugin_windows.ps1
      - name: Set and check release Codex plugin version
        shell: powershell
        run: |
          $StagingRoot = Join-Path $env:GITHUB_WORKSPACE "dist\codex-plugin\windows-x64\usagi"
          $PluginJson = Join-Path $StagingRoot "plugin.json"
          $PluginContent = [System.IO.File]::ReadAllText($PluginJson)
          $VersionPattern = [regex]::new('(?m)^([ \t]*"version"[ \t]*:[ \t]*")[^"]+(".*)$')
          $VersionMatches = $VersionPattern.Matches($PluginContent)
          if ($VersionMatches.Count -ne 1) {
              throw "expected one version entry in $PluginJson, found $($VersionMatches.Count)"
          }
          $Replacement = '${1}' + $env:RELEASE_VERSION + '${2}'
          $UpdatedPluginContent = $VersionPattern.Replace($PluginContent, $Replacement, 1)
          [System.IO.File]::WriteAllText(
              $PluginJson,
              $UpdatedPluginContent,
              [System.Text.UTF8Encoding]::new($false)
          )

          powershell -File scripts/ci/check_codex_plugin_windows.ps1 -PluginRoot dist/codex-plugin/windows-x64/usagi -ExpectedVersion $env:RELEASE_VERSION
          if ($LASTEXITCODE -ne 0) {
              throw "Windows Codex Plugin package Gate failed with exit code $LASTEXITCODE"
          }

          $PluginZip = Join-Path $env:GITHUB_WORKSPACE "dist\Usagi-Codex-Plugin-v$($env:RELEASE_VERSION)-windows-x64.zip"
          if (Test-Path -LiteralPath $PluginZip) {
              Remove-Item -LiteralPath $PluginZip -Force
          }
          Compress-Archive -Path (Join-Path $StagingRoot "*") -DestinationPath $PluginZip -CompressionLevel Optimal
          if (-not (Test-Path -LiteralPath $PluginZip -PathType Leaf) -or (Get-Item -LiteralPath $PluginZip).Length -eq 0) {
              throw "Windows Codex Plugin zip was not created: $PluginZip"
          }
      - name: Upload Windows runtime artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-windows-runtime
          path: dist/Usagi-v${{ steps.release_version.outputs.version }}-windows-x64-setup.exe
          if-no-files-found: error
      - name: Upload Windows Plugin artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-windows-plugin
          path: dist/Usagi-Codex-Plugin-v${{ steps.release_version.outputs.version }}-windows-x64.zip
          if-no-files-found: error

  publish:
    name: Publish GitHub Release
    needs:
      - build-macos-arm64
      - build-windows-x64
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_REPO: ${{ github.repository }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Resolve release version
        shell: bash
        run: |
          if [[ ! "$GITHUB_REF_NAME" =~ ^v([0-9]+\.[0-9]+\.[0-9]+(-rc\.[0-9]+)?)$ ]]; then
            printf 'invalid release tag: %s\n' "$GITHUB_REF_NAME" >&2
            exit 1
          fi
          printf 'RELEASE_VERSION=%s\n' "${BASH_REMATCH[1]}" >> "$GITHUB_ENV"
      - name: Download release artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: release-*
          path: release-assets
          merge-multiple: true
      - name: Verify release artifacts
        shell: bash
        run: |
          shopt -s nullglob
          expected=(
            "Usagi-v${RELEASE_VERSION}-macos-arm64.dmg"
            "Usagi-Codex-Plugin-v${RELEASE_VERSION}-macos-arm64.zip"
            "Usagi-v${RELEASE_VERSION}-windows-x64-setup.exe"
            "Usagi-Codex-Plugin-v${RELEASE_VERSION}-windows-x64.zip"
          )
          files=(release-assets/*)
          if [[ "${#files[@]}" -ne 4 ]]; then
            printf 'expected four release assets, found %s\n' "${#files[@]}" >&2
            printf '%s\n' "${files[@]}" >&2
            exit 1
          fi

          for required in "${expected[@]}"; do
            if [[ ! -f "release-assets/$required" ]]; then
              printf 'missing expected release asset: %s\n' "$required" >&2
              exit 1
            fi
          done
          for file in "${files[@]}"; do
            case "${file##*/}" in
              "Usagi-v${RELEASE_VERSION}-macos-arm64.dmg" | \
              "Usagi-Codex-Plugin-v${RELEASE_VERSION}-macos-arm64.zip" | \
              "Usagi-v${RELEASE_VERSION}-windows-x64-setup.exe" | \
              "Usagi-Codex-Plugin-v${RELEASE_VERSION}-windows-x64.zip")
                ;;
              *)
                printf 'unexpected release asset: %s\n' "$file" >&2
                exit 1
                ;;
            esac
          done

          python3 - "$RELEASE_VERSION" \
            "release-assets/Usagi-Codex-Plugin-v${RELEASE_VERSION}-macos-arm64.zip" \
            "release-assets/Usagi-Codex-Plugin-v${RELEASE_VERSION}-windows-x64.zip" <<'PY'
          import json
          import sys
          import zipfile

          version = sys.argv[1]
          for path in sys.argv[2:]:
              with zipfile.ZipFile(path) as archive:
                  manifest_names = [
                      name for name in archive.namelist()
                      if name in ("plugin.json", "./plugin.json")
                  ]
                  if len(manifest_names) != 1:
                      raise SystemExit(
                          f"{path} must contain exactly one root plugin.json"
                      )
                  manifest = json.loads(archive.read(manifest_names[0]))
                  if manifest.get("version") != version:
                      raise SystemExit(
                          f"{path} plugin.json version {manifest.get('version')!r} "
                          f"does not equal {version!r}"
                      )
          PY
      - name: Publish four release assets
        shell: bash
        run: |
          files=(
            "release-assets/Usagi-v${RELEASE_VERSION}-macos-arm64.dmg"
            "release-assets/Usagi-Codex-Plugin-v${RELEASE_VERSION}-macos-arm64.zip"
            "release-assets/Usagi-v${RELEASE_VERSION}-windows-x64-setup.exe"
            "release-assets/Usagi-Codex-Plugin-v${RELEASE_VERSION}-windows-x64.zip"
          )
          args=(
            "$GITHUB_REF_NAME"
            "${files[@]}"
            --verify-tag
            --title "Usagi $RELEASE_VERSION"
            --generate-notes
          )
          if [[ "$RELEASE_VERSION" == *-rc.* ]]; then
            args+=(--prerelease)
          else
            args+=(--latest)
          fi
          gh release create "${args[@]}"
