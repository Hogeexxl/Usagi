name: Cleanup merged branches

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/cleanup-merged-branches.yml"

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Delete merged feature branches
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          for ref in             "heads/codex/public-api-v1"             "heads/codex/windows-usagi-tray-fixes"
          do
            curl --fail-with-body --silent --show-error --location               --request DELETE               --header "Accept: application/vnd.github+json"               --header "Authorization: Bearer $GH_TOKEN"               --header "X-GitHub-Api-Version: 2022-11-28"               "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/git/refs/$ref"
          done
